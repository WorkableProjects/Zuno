<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zuno is a console-style game launcher and builder. Load a game file, host it on this screen, or build your own." />
    <meta name="theme-color" content="#080B12" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./zuno-icon-192.png" />
    <title>Zuno</title>
    <script>
      // Apply the saved theme before first paint so the wrong theme never flashes.
      try {
        var t = localStorage.getItem("zuno.theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
